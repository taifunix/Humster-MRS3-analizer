[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mrs3"
version = "0.7.0"
description = "Deterministic MRS3 v0.7 selector and hamster-bot tester runner"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2,<3",
  "openpyxl>=3.1,<4",
  "lxml>=5,<7",
  "httpx>=0.27,<1",
  "psutil>=6,<8",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9"]

[project.scripts]
mrs3 = "mrs3.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
