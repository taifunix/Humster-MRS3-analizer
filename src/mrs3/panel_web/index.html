<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MRS3 Control Panel</title>
  <link rel="stylesheet" href="/panel-web/app.css">
</head>
<body>
  <nav aria-label="MRS3 sections">

    <a href="#source-db">Source DB</a>

    <h1>Testing</h1>
    <p id="status" aria-live="polite">Loading panel status...</p>

    <section id="surfaces" hidden aria-label="Surfaces"></section>
    <section id="strategies-dd5" hidden aria-label="Strategies and DD5"></section>

  <script src="/panel-web/app.js"></script>

</html>
